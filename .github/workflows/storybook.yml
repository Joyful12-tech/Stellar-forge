name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/storybook-static

  deploy:
    # Runs on pull_request too so the artifact is validated before merge.
    # Only the deployment step below is restricted to main, so a PR never
    # overwrites the published Pages site.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Storybook artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: storybook-preview

      - name: Check artifact contents
        run: |
          # upload-pages-artifact uploads a single tarball of the static site
          test -f storybook-preview/artifact.tar
          tar -tf storybook-preview/artifact.tar > storybook-contents.txt
          head -20 storybook-contents.txt
          if ! grep -qE '(^|/)index\.html$' storybook-contents.txt; then
            echo "::error::Storybook artifact is missing index.html"
            exit 1
          fi
          echo "Storybook artifact verified: $(grep -c . storybook-contents.txt) files, $(du -h storybook-preview/artifact.tar | cut -f1)"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report preview build
        if: github.ref != 'refs/heads/main'
        run: |
          {
            echo "### Storybook artifact validated"
            echo ""
            echo "This run built and verified the static Storybook bundle."
            echo "The GitHub Pages deployment only runs on \`main\`, so this PR does not publish it."
          } >> "$GITHUB_STEP_SUMMARY"
