[package]
name = "token-factory-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
token-factory = { package = "token-factory-testutils-lib", path = "../testutils-lib", features = ["testutils"] }

[[bin]]
name = "fuzz_create_token"
path = "fuzz_targets/fuzz_create_token.rs"
test = false
doc = false

[[bin]]
name = "fuzz_fee_arithmetic"
path = "fuzz_targets/fuzz_fee_arithmetic.rs"
test = false
doc = false

[[bin]]
name = "fuzz_burn"
path = "fuzz_targets/fuzz_burn.rs"
test = false
doc = false

[[bin]]
name = "fuzz_set_metadata"
path = "fuzz_targets/fuzz_set_metadata.rs"
test = false
doc = false

[[bin]]
name = "fuzz_mint_tokens"
path = "fuzz_targets/fuzz_mint_tokens.rs"
test = false
doc = false

[profile.release]
opt-level = 3

