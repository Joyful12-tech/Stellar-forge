[package]
name = "stellar-forge-controller"
version = "0.1.0"
edition = "2021"
description = "Kubernetes operator that provisions ephemeral Stellar testnets via the StellarTestnet CRD"
license = "MIT"
publish = false

[dependencies]
kube = { version = "1", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
k8s-openapi = { version = "0.25", default-features = false, features = ["latest"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
