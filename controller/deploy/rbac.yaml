# RBAC for the StellarForge ephemeral testnet operator.
#
# The operator watches StellarTestnet resources across all namespaces and
# owns one Deployment plus two Services (and optionally one Ingress) per
# testnet, so it needs cluster-wide permissions for those resources. It also
# installs the StellarTestnet CRD itself on startup.
#
#   kubectl apply -f controller/deploy/rbac.yaml
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-forge-controller
  namespace: stellar-forge-system
  labels:
    app.kubernetes.io/name: stellar-forge-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-forge-controller
  labels:
    app.kubernetes.io/name: stellar-forge-controller
rules:
  # The StellarTestnet resource: reconcile loop, finalizer patches and
  # TTL based self-deletion.
  - apiGroups: ["stellar.forge.dev"]
    resources: ["stellartestnets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Connection URLs, phases, conditions and funded keys live in status.
  - apiGroups: ["stellar.forge.dev"]
    resources: ["stellartestnets/status"]
    verbs: ["get", "update", "patch"]
  # Finalizers are patched through the main resource, but grant the
  # subresource explicitly so future-proof against server-side enforcement.
  - apiGroups: ["stellar.forge.dev"]
    resources: ["stellartestnets/finalizers"]
    verbs: ["update", "patch"]
  # The operator installs the StellarTestnet CRD at startup so a fresh
  # deployment can serve the resource immediately.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Child resources of every testnet. deletecollection backs the finalizer
  # sweep that guarantees complete teardown when a CR is deleted.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs:
      [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch",
        "delete",
        "deletecollection",
      ]
  - apiGroups: [""]
    resources: ["services"]
    verbs:
      [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch",
        "delete",
        "deletecollection",
      ]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs:
      [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch",
        "delete",
        "deletecollection",
      ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-forge-controller
  labels:
    app.kubernetes.io/name: stellar-forge-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-forge-controller
subjects:
  - kind: ServiceAccount
    name: stellar-forge-controller
    namespace: stellar-forge-system
